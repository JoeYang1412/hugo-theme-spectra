<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19"/>
      <stop offset="100%" style="stop-color:#1a2338"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="25" r="7" fill="#27c93f"/>
  <text x="40" y="80" font-family="monospace" font-size="14" fill="#c792ea">import</text>
  <text x="110" y="80" font-family="monospace" font-size="14" fill="#e4e8f1"> { useState } </text>
  <text x="260" y="80" font-family="monospace" font-size="14" fill="#c792ea">from</text>
  <text x="305" y="80" font-family="monospace" font-size="14" fill="#c3e88d"> 'react'</text>
  <text x="40" y="110" font-family="monospace" font-size="14" fill="#546e7a">// Custom hook for dark mode</text>
  <text x="40" y="140" font-family="monospace" font-size="14" fill="#c792ea">export function</text>
  <text x="195" y="140" font-family="monospace" font-size="14" fill="#82aaff"> useDarkMode</text>
  <text x="330" y="140" font-family="monospace" font-size="14" fill="#e4e8f1">() {</text>
  <text x="60" y="170" font-family="monospace" font-size="14" fill="#c792ea">const</text>
  <text x="112" y="170" font-family="monospace" font-size="14" fill="#e4e8f1"> [dark, setDark] = </text>
  <text x="310" y="170" font-family="monospace" font-size="14" fill="#82aaff">useState</text>
  <text x="385" y="170" font-family="monospace" font-size="14" fill="#e4e8f1">(</text>
  <text x="395" y="170" font-family="monospace" font-size="14" fill="#ff5370">false</text>
  <text x="440" y="170" font-family="monospace" font-size="14" fill="#e4e8f1">)</text>
  <text x="60" y="200" font-family="monospace" font-size="14" fill="#c792ea">return</text>
  <text x="115" y="200" font-family="monospace" font-size="14" fill="#e4e8f1"> { dark, setDark }</text>
  <text x="40" y="230" font-family="monospace" font-size="14" fill="#e4e8f1">}</text>
  <rect x="550" y="300" width="200" height="100" rx="8" fill="none" stroke="#4a7de0" stroke-width="1" opacity="0.3"/>
  <text x="580" y="355" font-family="sans-serif" font-size="12" fill="#5b8dee" opacity="0.5">Spectra Theme</text>
</svg>
