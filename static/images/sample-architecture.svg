<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f2f8"/>
      <stop offset="100%" style="stop-color:#e8ecf4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)" rx="12"/>
  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="600" fill="#1c1e26" text-anchor="middle">Hugo Build Pipeline</text>
  <!-- Content box -->
  <rect x="50" y="80" width="160" height="60" rx="10" fill="#fff" stroke="#4a7de0" stroke-width="2"/>
  <text x="130" y="115" font-family="sans-serif" font-size="14" fill="#1c1e26" text-anchor="middle">Content (MD)</text>
  <!-- Templates box -->
  <rect x="50" y="200" width="160" height="60" rx="10" fill="#fff" stroke="#e8609e" stroke-width="2"/>
  <text x="130" y="235" font-family="sans-serif" font-size="14" fill="#1c1e26" text-anchor="middle">Templates (HTML)</text>
  <!-- Arrow from content to Hugo -->
  <line x1="210" y1="110" x2="310" y2="200" stroke="#4a7de0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow from templates to Hugo -->
  <line x1="210" y1="230" x2="310" y2="220" stroke="#e8609e" stroke-width="2"/>
  <!-- Hugo box -->
  <rect x="310" y="180" width="180" height="80" rx="14" fill="#4a7de0" stroke="none"/>
  <text x="400" y="225" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Hugo Engine</text>
  <!-- Assets box -->
  <rect x="50" y="320" width="160" height="60" rx="10" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="130" y="355" font-family="sans-serif" font-size="14" fill="#1c1e26" text-anchor="middle">Assets (SCSS/JS)</text>
  <!-- Arrow from assets to Hugo -->
  <line x1="210" y1="350" x2="310" y2="240" stroke="#a78bfa" stroke-width="2"/>
  <!-- Arrow from Hugo to Output -->
  <line x1="490" y1="220" x2="580" y2="220" stroke="#1c1e26" stroke-width="2"/>
  <polygon points="580,215 595,220 580,225" fill="#1c1e26"/>
  <!-- Output box -->
  <rect x="600" y="180" width="160" height="80" rx="14" fill="#27c93f" stroke="none" opacity="0.9"/>
  <text x="680" y="215" font-family="sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">public/</text>
  <text x="680" y="240" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" opacity="0.8">Static HTML</text>
  <!-- Data box -->
  <rect x="50" y="430" width="160" height="50" rx="10" fill="#fff" stroke="#ffbd2e" stroke-width="2"/>
  <text x="130" y="460" font-family="sans-serif" font-size="14" fill="#1c1e26" text-anchor="middle">Data (TOML/JSON)</text>
  <line x1="210" y1="445" x2="360" y2="260" stroke="#ffbd2e" stroke-width="1.5" stroke-dasharray="6"/>
</svg>
