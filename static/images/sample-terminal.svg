<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1f2e" rx="12"/>
  <!-- Title bar -->
  <rect width="800" height="40" fill="#0f1320" rx="12"/>
  <rect x="0" y="28" width="800" height="12" fill="#0f1320"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="24" font-family="monospace" font-size="12" fill="#b0b8c8" text-anchor="middle">~/project</text>
  <!-- Terminal lines -->
  <text x="20" y="72" font-family="monospace" font-size="13" fill="#27c93f">$</text>
  <text x="36" y="72" font-family="monospace" font-size="13" fill="#e4e8f1"> hugo server -D</text>
  <text x="20" y="100" font-family="monospace" font-size="13" fill="#b0b8c8">Watching for changes in /project/{archetypes,assets,content,...</text>
  <text x="20" y="124" font-family="monospace" font-size="13" fill="#b0b8c8">Watching for config changes in /project/hugo.toml</text>
  <text x="20" y="148" font-family="monospace" font-size="13" fill="#b0b8c8">Environment: "development"</text>
  <text x="20" y="172" font-family="monospace" font-size="13" fill="#b0b8c8">Serving pages from disk</text>
  <text x="20" y="196" font-family="monospace" font-size="13" fill="#b0b8c8">Running in Fast Render Mode.</text>
  <text x="20" y="230" font-family="monospace" font-size="13" fill="#5b8dee">Web Server is available at</text>
  <text x="260" y="230" font-family="monospace" font-size="13" fill="#82aaff"> http://localhost:1313/</text>
  <text x="20" y="258" font-family="monospace" font-size="13" fill="#27c93f">Press Ctrl+C to stop</text>
  <!-- Blinking cursor -->
  <rect x="20" y="280" width="8" height="16" fill="#5b8dee" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
