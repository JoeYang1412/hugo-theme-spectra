baseURL = 'https://example.com'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
theme = 'hugo-theme-spectra'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  # === Content Limits ===
  homepagePostsLimit = 10
  cardSummaryLength = 150
  relatedPostsLimit = 3
  cardImageQuality = 80
  coverImageQuality = 85
  # contentImageQuality = 90         # 內文圖片壓縮品質（1-100，需搭配 imageOptimize = true）

  # === Banner Text (uncomment to customize) ===
  # bannerTitle = 'My'
  # bannerHighlight = 'Tech Notes'
  # bannerSubtitle = '// blog × code × ideas'

  # === Feature Toggles (default: true, set false to disable) ===
  enableLoadingAnimation = true
  enableMouseGlow = true
  showBanner = true
  showReadingProgress = true
  enableLightbox = true
  showScrollTop = true
  enableSearch = true
  showRelatedPosts = true
  showSeriesNav = true
  enableCodeCopy = true
  enableScrollAnimation = true

  # === Share ===
  sharePlatforms = ['twitter', 'facebook', 'linkedin']

  # === Advanced: Custom CSS/JS ===
  # customCSS = ['css/custom.css']
  # customJS = ['js/custom.js']
  # googleFontsURL = 'https://fonts.googleapis.com/css2?family=...'

  # === Style Overrides ===
  [params.style]
    colorAccent = '#4a7de0'
    colorAccentWarm = '#e8609e'
    colorAccentSoft = '#a78bfa'
    fontDisplay = "'Outfit', sans-serif"
    fontBody = "'Zen Maru Gothic', 'Noto Sans TC', sans-serif"
    fontMono = "'JetBrains Mono', monospace"
    bannerImageText = '#fff'
    # bannerImageSubtitle = 'rgba(255, 255, 255, 0.8)'
    bannerImageGradient = 'linear-gradient(135deg, #4a7de0, #e8609e)'
    bannerImageGradientFill = 'transparent'

  [params.sidebar]
    showAllPosts = true
    showCategories = true
    showTags = true
    showRecent = true
    categoryLimit = 5
    tagsLimit = 20
    recentLimit = 5
    # tagWarmThreshold = 3   # 文章數 >= 此值的標籤顯示粉色（不設定則自動計算）

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

# ============================================
# Languages
# ============================================

[languages]
  [languages.zh-tw]
    languageCode = 'zh-tw'
    languageName = '繁體中文'
    weight = 1
    title = 'Spectra Demo'

    [languages.zh-tw.params]
      description = '一款具有科幻風格的 Hugo 部落格主題'
      author = 'Your Name'
      tagline = '// Developer'
      bio = '這是一個示範網站，展示 Spectra 主題的所有功能。'
      #banner = '/images/demo02.jpg'
      #avatar = '/images/avatar.webp'

      [[languages.zh-tw.params.social]]
        name = "GitHub"
        url = "https://github.com/your-account"
      [[languages.zh-tw.params.social]]
        name = "Twitter"
        url = "https://x.com/your-account"
      [[languages.zh-tw.params.social]]
        name = "RSS"
        url = "/index.xml"

    # -- Navigation Menu --
    [[languages.zh-tw.menus.main]]
      name = "首頁"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.zh-tw.menus.main]]
      name = "文章"
      pageRef = "/posts"
      weight = 2
      pre = "✎"
    [[languages.zh-tw.menus.main]]
      name = "關於"
      pageRef = "/about"
      weight = 5
      pre = "◉"

  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    weight = 2
    title = 'Spectra Demo'

    [languages.en.params]
      description = 'A sci-fi fusion Hugo blog theme'
      author = 'Your Name'
      tagline = '// Developer'
      bio = 'This is a demo site showcasing all features of the Spectra theme.'

      [[languages.en.params.social]]
        name = "GitHub"
        url = "https://github.com/your-account"
      [[languages.en.params.social]]
        name = "Twitter"
        url = "https://x.com/your-account"
      [[languages.en.params.social]]
        name = "RSS"
        url = "/index.xml"

    [[languages.en.menus.main]]
      name = "Home"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/posts"
      weight = 2
      pre = "✎"
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 5
      pre = "◉"

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
